name: Site regression tests

# Runs on every push to main and on pull requests, so desktop + mobile
# rendering and navigation are checked before and after each site update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5

      # Build the site the same way GitHub Pages does (Jekyll), so the tests
      # run against the real deployed output, including the shared includes.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium webkit

      - name: Run regression tests (desktop + mobile)
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 14

      # On a failing run, upload the failure screenshots (and traces) on their
      # own, so you can see the broken rendering without opening the full report.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-screenshots
          path: tests/test-results
          retention-days: 14
          if-no-files-found: ignore
